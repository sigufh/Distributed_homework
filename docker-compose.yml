services:
  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  # Product DB master (write)
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    command:
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=shop
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_pass123
    ports:
      - "3307:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./mysql/master/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Product DB replica (read)
  mysql-replica:
    image: mysql:8.0
    container_name: mysql-replica
    depends_on:
      mysql-master:
        condition: service_healthy
    command:
      - "--server-id=2"
      - "--relay-log=mysql-relay-bin"
      - "--read-only=ON"
      - "--skip-slave-start=1"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
    ports:
      - "3308:3306"
    volumes:
      - mysql_replica_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Setup replication between master and replica
  mysql-replica-setup:
    image: mysql:8.0
    container_name: mysql-replica-setup
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c "
      set -e;
      until mysql -hmysql-master -uroot -proot123456 -e 'SELECT 1' >/dev/null 2>&1; do sleep 2; done;
      until mysql -hmysql-replica -uroot -proot123456 -e 'SELECT 1' >/dev/null 2>&1; do sleep 2; done;
      MASTER_STATUS=$$(mysql -hmysql-master -uroot -proot123456 -Nse 'SHOW MASTER STATUS');
      LOG_FILE=$$(echo $$MASTER_STATUS | awk '{print $$1}');
      LOG_POS=$$(echo $$MASTER_STATUS | awk '{print $$2}');
      mysql -hmysql-replica -uroot -proot123456 -e \"
        STOP REPLICA;
        RESET REPLICA ALL;
        CHANGE REPLICATION SOURCE TO
          SOURCE_HOST='mysql-master',
          SOURCE_PORT=3306,
          SOURCE_USER='repl_user',
          SOURCE_PASSWORD='repl_pass123',
          SOURCE_LOG_FILE='$$LOG_FILE',
          SOURCE_LOG_POS=$$LOG_POS,
          SOURCE_CONNECT_RETRY=5;
        START REPLICA;
      \";
      "

  # Order shard DB 0
  mysql-order-0:
    image: mysql:8.0
    container_name: mysql-order-0
    profiles: ["sharding"]
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=shop_order
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_pass123
    ports:
      - "3311:3306"
    volumes:
      - mysql_order0_data:/var/lib/mysql
      - ./mysql/order0/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Order shard DB 1
  mysql-order-1:
    image: mysql:8.0
    container_name: mysql-order-1
    profiles: ["sharding"]
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=shop_order
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_pass123
    ports:
      - "3312:3306"
    volumes:
      - mysql_order1_data:/var/lib/mysql
      - ./mysql/order1/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ShardingSphere-Proxy for order sharding
  shardingsphere-proxy:
    image: apache/shardingsphere-proxy:5.4.1
    container_name: shardingsphere-proxy
    profiles: ["sharding"]
    depends_on:
      mysql-order-0:
        condition: service_healthy
      mysql-order-1:
        condition: service_healthy
    ports:
      - "13307:3307"
    volumes:
      - ./shardingsphere-proxy/conf/server.yaml:/opt/shardingsphere-proxy/conf/server.yaml:ro
      - ./shardingsphere-proxy/conf/config-shop_order.yaml:/opt/shardingsphere-proxy/conf/config-shop_order.yaml:ro

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"

  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend1
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - REDIS_HOST=redis
      - MYSQL_ENABLED=true
      - MYSQL_WRITE_HOST=mysql-master
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=shop
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_pass123
      - ORDER_SHARDING_ENABLED=${ORDER_SHARDING_ENABLED:-false}
      - ORDER_DB_HOST=${ORDER_DB_HOST:-shardingsphere-proxy}
      - ORDER_DB_PORT=${ORDER_DB_PORT:-3307}
      - ORDER_DB_DATABASE=${ORDER_DB_DATABASE:-shop_order}
      - ORDER_DB_USER=${ORDER_DB_USER:-app_user}
      - ORDER_DB_PASSWORD=${ORDER_DB_PASSWORD:-app_pass123}
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=distributed-homework
      - KAFKA_TOPIC_SECKILL_ORDER=seckill-order-create
      - KAFKA_CONSUMER_GROUP=seckill-order-worker
      - ES_ENABLED=${ES_ENABLED:-false}
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=products
    depends_on:
      redis:
        condition: service_started
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      mysql-replica-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      shardingsphere-proxy:
        condition: service_started
        required: false

  backend2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend2
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - REDIS_HOST=redis
      - MYSQL_ENABLED=true
      - MYSQL_WRITE_HOST=mysql-master
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=shop
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_pass123
      - ORDER_SHARDING_ENABLED=${ORDER_SHARDING_ENABLED:-false}
      - ORDER_DB_HOST=${ORDER_DB_HOST:-shardingsphere-proxy}
      - ORDER_DB_PORT=${ORDER_DB_PORT:-3307}
      - ORDER_DB_DATABASE=${ORDER_DB_DATABASE:-shop_order}
      - ORDER_DB_USER=${ORDER_DB_USER:-app_user}
      - ORDER_DB_PASSWORD=${ORDER_DB_PASSWORD:-app_pass123}
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=distributed-homework
      - KAFKA_TOPIC_SECKILL_ORDER=seckill-order-create
      - KAFKA_CONSUMER_GROUP=seckill-order-worker
      - ES_ENABLED=${ES_ENABLED:-false}
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=products
    depends_on:
      redis:
        condition: service_started
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      mysql-replica-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      shardingsphere-proxy:
        condition: service_started
        required: false

  backend3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend3
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - REDIS_HOST=redis
      - MYSQL_ENABLED=true
      - MYSQL_WRITE_HOST=mysql-master
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=shop
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_pass123
      - ORDER_SHARDING_ENABLED=${ORDER_SHARDING_ENABLED:-false}
      - ORDER_DB_HOST=${ORDER_DB_HOST:-shardingsphere-proxy}
      - ORDER_DB_PORT=${ORDER_DB_PORT:-3307}
      - ORDER_DB_DATABASE=${ORDER_DB_DATABASE:-shop_order}
      - ORDER_DB_USER=${ORDER_DB_USER:-app_user}
      - ORDER_DB_PASSWORD=${ORDER_DB_PASSWORD:-app_pass123}
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=distributed-homework
      - KAFKA_TOPIC_SECKILL_ORDER=seckill-order-create
      - KAFKA_CONSUMER_GROUP=seckill-order-worker
      - ES_ENABLED=${ES_ENABLED:-false}
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=products
    depends_on:
      redis:
        condition: service_started
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      mysql-replica-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      shardingsphere-proxy:
        condition: service_started
        required: false

  backend4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend4
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - REDIS_HOST=redis
      - MYSQL_ENABLED=true
      - MYSQL_WRITE_HOST=mysql-master
      - MYSQL_READ_HOSTS=mysql-replica
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=shop
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_pass123
      - ORDER_SHARDING_ENABLED=${ORDER_SHARDING_ENABLED:-false}
      - ORDER_DB_HOST=${ORDER_DB_HOST:-shardingsphere-proxy}
      - ORDER_DB_PORT=${ORDER_DB_PORT:-3307}
      - ORDER_DB_DATABASE=${ORDER_DB_DATABASE:-shop_order}
      - ORDER_DB_USER=${ORDER_DB_USER:-app_user}
      - ORDER_DB_PASSWORD=${ORDER_DB_PASSWORD:-app_pass123}
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=distributed-homework
      - KAFKA_TOPIC_SECKILL_ORDER=seckill-order-create
      - KAFKA_CONSUMER_GROUP=seckill-order-worker
      - ES_ENABLED=${ES_ENABLED:-false}
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=products
    depends_on:
      redis:
        condition: service_started
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      mysql-replica-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      shardingsphere-proxy:
        condition: service_started
        required: false

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      backend1:
        condition: service_started
      backend2:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro

  # Optional Elasticsearch for search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    profiles: ["search"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  mysql_master_data:
  mysql_replica_data:
  mysql_order0_data:
  mysql_order1_data:
  es_data:
