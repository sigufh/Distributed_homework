version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend1
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - REDIS_HOST=redis
    depends_on:
      - redis

  backend2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend2
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - REDIS_HOST=redis
    depends_on:
      - redis

  backend3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend3
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - REDIS_HOST=redis
    depends_on:
      - redis

  backend4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend4
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - REDIS_HOST=redis
    depends_on:
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - backend1
      - backend2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro

