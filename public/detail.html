<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商品详情 - 云市集</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">云市集</a>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/search.html">搜索</a>
      </nav>
      <form id="global-search" class="search-bar" role="search">
        <input
          id="global-search-input"
          type="search"
          placeholder="搜索商品，例如：分布式"
          aria-label="搜索商品"
        />
        <button type="submit">搜索</button>
      </form>
    </header>

    <main class="page">
      <a href="/" class="back-link">← 返回首页</a>
      <section id="detail-panel" class="detail-layout">
        <article class="product-preview skeleton-block"></article>
        <article class="product-meta skeleton-block"></article>
      </section>

      <section class="section-head">
        <h2>你可能还喜欢</h2>
      </section>
      <section id="related-grid" class="product-grid"></section>
    </main>

    <footer class="site-footer">
      <p>云市集 · 商品详情</p>
    </footer>

    <script src="/assets/store.js"></script>
    <script>
      const { api, ui, navigateToSearch, parseNumberParam } = window.StoreUI;
      const searchForm = document.getElementById("global-search");
      const searchInput = document.getElementById("global-search-input");

      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        navigateToSearch(searchInput.value);
      });

      const productId = parseNumberParam("id", 1);

      async function renderDetail() {
        const panel = document.getElementById("detail-panel");
        const related = document.getElementById("related-grid");
        try {
          const product = await api.getProduct(productId);
          document.title = `${product.name} - 云市集`;

          panel.innerHTML = `
            <article class="product-preview">
              <div class="cover-art">
                <span>${ui.escapeHtml(product.name.slice(0, 1))}</span>
              </div>
            </article>
            <article class="product-meta">
              <p class="eyebrow">商品 ID ${product.id}</p>
              <h1>${ui.escapeHtml(product.name)}</h1>
              <p class="price">${ui.money(product.price)}</p>
              <p class="stock ${product.stock > 0 ? "in-stock" : "out-stock"}">
                ${product.stock > 0 ? `库存 ${product.stock} 件` : "暂时缺货"}
              </p>
              <p class="description">
                这本商品支持高并发详情访问，接口层具备缓存防护能力，可稳定应对热点读流量。
              </p>
              <div class="action-row">
                <button type="button">立即购买</button>
                <button type="button" class="ghost">加入收藏</button>
              </div>
            </article>
          `;

          const ids = [1, 2, 3].filter((id) => Number(id) !== Number(product.id));
          const list = await Promise.all(ids.map((id) => api.getProduct(id)));
          related.innerHTML = list.length
            ? list.map(ui.renderCard).join("")
            : '<div class="empty-state">暂无更多推荐商品</div>';
        } catch (err) {
          panel.innerHTML = `<div class="empty-state">${ui.escapeHtml(
            err.message || "商品加载失败"
          )}</div>`;
          related.innerHTML = "";
        }
      }

      renderDetail();
    </script>
  </body>
</html>
