<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>搜索商品 - 云市集</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">云市集</a>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/search.html">搜索</a>
        <a href="/cart.html" class="cart-link"
          >购物车<span id="cart-count" class="cart-badge">0</span></a
        >
        <a href="/orders.html">我的订单</a>
      </nav>
      <form id="global-search" class="search-bar" role="search">
        <input
          id="global-search-input"
          type="search"
          placeholder="输入关键词，回车搜索"
          aria-label="搜索商品"
        />
        <button type="submit">搜索</button>
      </form>
      <div class="user-box">
        <input id="user-id-input" type="number" min="1" placeholder="用户ID" />
        <button id="save-user-id-btn" type="button">保存</button>
      </div>
    </header>

    <main class="page">
      <section class="section-head">
        <h1 id="search-title">搜索结果</h1>
        <p id="search-meta" class="subtle-text"></p>
      </section>
      <section id="search-grid" class="product-grid"></section>
    </main>

    <footer class="site-footer">
      <p>云市集 · 搜索与下单</p>
    </footer>
    <div id="toast-root"></div>

    <script src="/assets/store.js"></script>
    <script>
      const {
        api,
        ui,
        getParam,
        getUserId,
        addToCart,
        navigateToSearch,
        navigateToDetail,
        bindHeaderUserSave,
        setHeaderCartCount,
        showToast,
      } = window.StoreUI;

      const searchForm = document.getElementById("global-search");
      const searchInput = document.getElementById("global-search-input");
      const title = document.getElementById("search-title");
      const meta = document.getElementById("search-meta");
      const grid = document.getElementById("search-grid");
      const productMap = new Map();

      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        navigateToSearch(searchInput.value);
      });

      bindHeaderUserSave();
      setHeaderCartCount();

      async function runSearch() {
        const keyword = (getParam("q") || "").trim();
        searchInput.value = keyword;
        if (!keyword) {
          title.textContent = "输入关键词开始搜索";
          meta.textContent = "示例：Redis、分布式、系统";
          grid.innerHTML = "";
          return;
        }

        title.textContent = `“${keyword}” 的搜索结果`;
        grid.innerHTML = `
          <article class="product-card skeleton-card"></article>
          <article class="product-card skeleton-card"></article>
          <article class="product-card skeleton-card"></article>
        `;

        try {
          const result = await api.searchProducts(keyword, 24);
          result.list.forEach((p) => productMap.set(Number(p.id), p));
          meta.textContent = `共 ${result.list.length} 条，数据源：${result.source}`;
          grid.innerHTML = result.list.length
            ? result.list.map((p) => ui.renderCard(p)).join("")
            : '<div class="empty-state">没有找到相关商品，请换个关键词。</div>';
        } catch (err) {
          meta.textContent = "";
          grid.innerHTML = `<div class="empty-state">${ui.escapeHtml(
            err.message || "搜索失败"
          )}</div>`;
        }
      }

      async function onGridClick(event) {
        const button = event.target.closest("button[data-id]");
        if (!button) return;
        const pid = Number(button.dataset.id);
        const product = productMap.get(pid) || (await api.getProduct(pid));
        productMap.set(pid, product);

        if (button.classList.contains("btn-open-detail")) {
          navigateToDetail(pid);
          return;
        }
        if (button.classList.contains("btn-add-cart")) {
          addToCart(product, 1);
          setHeaderCartCount();
          showToast(`已加入购物车：${product.name}`);
          return;
        }
        if (button.classList.contains("btn-seckill")) {
          const userId = getUserId();
          const result = await api.placeSeckillOrderSafe(userId, pid);
          if (result.ok) {
            showToast(`秒杀请求已提交，订单号 ${result.payload.data.orderId}`);
          } else {
            showToast(result.payload?.msg || "秒杀失败", "error");
          }
        }
      }

      grid.addEventListener("click", (event) => {
        onGridClick(event).catch((err) => showToast(err.message || "操作失败", "error"));
      });

      runSearch();
    </script>
  </body>
</html>
