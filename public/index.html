<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>高并发读作业演示</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        margin: 0;
        padding: 0;
        background: #f5f7fa;
        color: #1f2933;
      }
      header {
        background: linear-gradient(90deg, #2563eb, #1d4ed8);
        color: #fff;
        padding: 16px 32px;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
      }
      header h1 {
        margin: 0;
        font-size: 20px;
      }
      main {
        max-width: 1080px;
        margin: 24px auto;
        padding: 0 16px 32px;
      }
      .card {
        background: #ffffff;
        border-radius: 10px;
        padding: 20px 24px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        margin-bottom: 20px;
      }
      .card h2 {
        margin-top: 0;
        font-size: 18px;
        border-left: 4px solid #2563eb;
        padding-left: 8px;
      }
      .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      label {
        font-size: 14px;
        color: #4b5563;
      }
      select,
      input[type="number"] {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        font-size: 14px;
        min-width: 120px;
      }
      button {
        padding: 8px 18px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
      }
      button.secondary {
        background: #10b981;
        box-shadow: 0 2px 6px rgba(5, 150, 105, 0.4);
      }
      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        margin-top: 8px;
      }
      th,
      td {
        padding: 6px 8px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
      }
      th {
        background: #f3f4f6;
        font-weight: 600;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: #e5edff;
        color: #1d4ed8;
      }
      .tag.green {
        background: #dcfce7;
        color: #16a34a;
      }
      .tag.gray {
        background: #e5e7eb;
        color: #374151;
      }
      .muted {
        color: #6b7280;
        font-size: 12px;
      }
      pre {
        background: #0b1220;
        color: #e5e7eb;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12px;
        overflow-x: auto;
      }
      .columns {
        display: grid;
        gap: 16px;
      }
      @media (min-width: 960px) {
        .columns {
          grid-template-columns: 2.3fr 1.7fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>高并发读 / Nginx 负载均衡 / Redis 缓存 演示面板</h1>
    </header>
    <main>
      <div class="columns">
        <section class="card">
          <h2>1. 通过 Nginx 访问商品详情（动静分离 + 负载均衡切换）</h2>
          <div class="form-row">
            <label>负载均衡算法：</label>
            <select id="lb-mode">
              <option value="rr">轮询 (upstream backend_rr)</option>
              <option value="ip">ip_hash (upstream backend_ip_hash)</option>
              <option value="w">加权轮询 (upstream backend_weighted)</option>
            </select>
            <label>商品 ID：</label>
            <input id="product-id" type="number" value="1" min="1" />
            <button id="btn-query">查询商品详情</button>
          </div>
          <div class="muted">
            说明：前端页面为静态文件，由 Nginx 直接返回；接口请求再由 Nginx 反向代理到多个后端实例。
          </div>
          <div id="product-result" style="margin-top: 12px"></div>
        </section>

        <section class="card">
          <h2>2. 后端实例状态（负载是否均衡）</h2>
          <div class="muted">
            建议在 JMeter 中对 `/api/products/1` 发压，然后点击“刷新实例状态”查看两个实例的请求分布是否接近。
          </div>
          <div class="form-row">
            <button class="secondary" id="btn-refresh-instance">
              刷新实例状态
            </button>
          </div>
          <table>
            <thead>
              <tr>
                <th>实例端口</th>
                <th>PID</th>
                <th>累计请求数</th>
              </tr>
            </thead>
            <tbody id="instance-table-body">
              <tr>
                <td colspan="3" class="muted">尚未加载数据</td>
              </tr>
            </tbody>
          </table>
        </section>
      </div>

      <!-- JMeter 可视化与“小贴士”模块已按要求移除，避免页面过于复杂 -->
    </main>

    <script>
      const $ = (id) => document.getElementById(id);

      function buildApiBase() {
        const mode = $("lb-mode").value;
        if (mode === "ip") return "/api_ip";
        if (mode === "w") return "/api_w";
        return "/api_rr";
      }

      async function queryProduct() {
        const btn = $("btn-query");
        btn.disabled = true;
        $("product-result").innerHTML = "";
        const base = buildApiBase();
        const id = $("product-id").value || 1;
        try {
          const resp = await fetch(`${base}/api/products/${id}`);
          const data = await resp.json();
          const html = `
            <div>
              <div class="tag">${
                data.code === 0 ? "成功" : "失败 " + data.code
              }</div>
              <div style="margin-top:8px;" class="muted">msg: ${
                data.msg
              }</div>
              <pre>${JSON.stringify(data.data, null, 2)}</pre>
            </div>
          `;
          $("product-result").innerHTML = html;
        } catch (e) {
          $("product-result").innerHTML =
            '<span style="color:#b91c1c;">请求失败：' + e.message + "</span>";
        } finally {
          btn.disabled = false;
        }
      }

      async function refreshInstances() {
        const tbody = $("instance-table-body");
        tbody.innerHTML =
          '<tr><td colspan="3" class="muted">加载中...</td></tr>';
        const ports = [8081, 8082, 8083, 8084];
        const results = [];
        for (const p of ports) {
          try {
            const resp = await fetch(`/api_rr/api/instance/info`, {
              headers: { "X-Target-Port": String(p) },
            });
            const data = await resp.json();
            if (data.code === 0) {
              results.push(data.data);
            }
          } catch (e) {
            // 忽略单个实例错误
          }
        }
        if (!results.length) {
          tbody.innerHTML =
            '<tr><td colspan="3" class="muted">暂时无法获取实例信息，请确认容器已启动。</td></tr>';
          return;
        }
        tbody.innerHTML = results
          .map(
            (r) =>
              `<tr><td>${r.port}</td><td>${r.pid}</td><td>${r.requestCount}</td></tr>`
          )
          .join("");
      }

      $("btn-query").addEventListener("click", queryProduct);
      $("btn-refresh-instance").addEventListener("click", refreshInstances);
    </script>
  </body>
</html>
