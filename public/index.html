<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>云市集 - 首页</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">云市集</a>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/search.html">搜索</a>
      </nav>
      <form id="global-search" class="search-bar" role="search">
        <input
          id="global-search-input"
          type="search"
          placeholder="搜索商品，例如：Redis"
          aria-label="搜索商品"
        />
        <button type="submit">搜索</button>
      </form>
    </header>

    <main class="page">
      <section class="hero">
        <p class="eyebrow">分布式商城演示</p>
        <h1>更快加载的商品详情页</h1>
        <p>商品详情由 Redis 缓存支撑，后端使用 MySQL 读写分离，确保访问稳定且响应迅速。</p>
        <a href="/search.html?q=Redis" class="hero-action">立即搜索热词</a>
      </section>

      <section class="section-head">
        <h2>精选商品</h2>
        <a href="/search.html?q=系统" class="text-link">查看更多</a>
      </section>

      <section id="featured-grid" class="product-grid">
        <article class="product-card skeleton-card"></article>
        <article class="product-card skeleton-card"></article>
        <article class="product-card skeleton-card"></article>
      </section>
    </main>

    <footer class="site-footer">
      <p>云市集 · Distributed Homework Demo</p>
    </footer>

    <script src="/assets/store.js"></script>
    <script>
      const { api, ui, navigateToSearch } = window.StoreUI;

      const searchForm = document.getElementById("global-search");
      const searchInput = document.getElementById("global-search-input");
      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        navigateToSearch(searchInput.value);
      });

      async function loadFeatured() {
        const ids = [1, 2, 3];
        const holder = document.getElementById("featured-grid");
        try {
          const products = await Promise.all(ids.map((id) => api.getProduct(id)));
          holder.innerHTML = products.map(ui.renderCard).join("");
        } catch (err) {
          holder.innerHTML = `<div class="empty-state">${ui.escapeHtml(
            err.message || "加载失败"
          )}</div>`;
        }
      }

      loadFeatured();
    </script>
  </body>
</html>
