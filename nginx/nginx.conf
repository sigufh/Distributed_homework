worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 定义上游后端服务
    upstream backend_rr {
        server backend1:8081;
        server backend2:8082;
        server backend3:8083;
        server backend4:8084;
    }

    upstream backend_ip_hash {
        ip_hash;
        server backend1:8081;
        server backend2:8082;
        server backend3:8083;
        server backend4:8084;
    }

    upstream backend_weighted {
        server backend1:8081 weight=1;
        server backend2:8082 weight=1;
        server backend3:8083 weight=1;
        server backend4:8084 weight=1;
    }

    server {
        listen       80;
        server_name  localhost;

        # 前端静态页面（动静分离：静态资源直接由 Nginx 处理）
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        # 后端 API，通过不同的 URL 参数选择不同负载均衡算法
        # /api_rr  -> 轮询
        # /api_ip  -> ip_hash
        # /api_w   -> 加权轮询
        location /api_rr/ {
            proxy_pass http://backend_rr/;
        }

        location /api_ip/ {
            proxy_pass http://backend_ip_hash/;
        }

        location /api_w/ {
            proxy_pass http://backend_weighted/;
        }

        # 直接代理 /api/ 到默认轮询 upstream，方便 JMeter 压测
        location /api/ {
            proxy_pass http://backend_rr/;
        }

        access_log  /var/log/nginx/access.log;
        error_log   /var/log/nginx/error.log;
    }
}

