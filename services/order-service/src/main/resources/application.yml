server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/seckill?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:seckill}
    password: ${DB_PASSWORD:seckill}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_order
  jackson:
    serialization:
      write-dates-as-timestamps: false

mybatis:
  type-aliases-package: com.distributed.orderservice.domain
  mapper-locations: classpath*:mapper/**/*.xml

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}

logging:
  level:
    root: INFO
    com.distributed.orderservice: INFO
