server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/seckill?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:seckill}
    password: ${DB_PASSWORD:seckill}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_inventory
  jackson:
    serialization:
      write-dates-as-timestamps: false

mybatis:
  type-aliases-package: com.distributed.inventoryservice.domain
  mapper-locations: classpath*:mapper/**/*.xml

logging:
  level:
    root: INFO
    com.distributed.inventoryservice: INFO
